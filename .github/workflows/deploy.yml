# =============================================================================
# Automart Frontend - Automatic Deploy
#
# Triggers:
#   - On every push to the `main` branch  -> build + deploy automatically
#   - Manually from the Actions tab       -> via "Run workflow" button
#
# What it does:
#   1. Checks out the code
#   2. Installs dependencies and builds the Next.js production bundle
#   3. Packages the app (source + built `.next`) into a tarball
#   4. Uploads the tarball to the server via SCP (password auth)
#   5. On the server: extracts, installs prod deps, restarts via PM2
#      (process name here is `automart-frontend`, running on port 3000)
#
# REQUIRED GitHub secrets (Repo -> Settings -> Secrets and variables -> Actions):
#   SERVER_HOST                 -> 187.52.116.124
#   SERVER_USERNAME             -> root
#   SERVER_PASSWORD             -> (your root password)
#   SERVER_SSH_PORT             -> 22   (SSH port)
#   APP_PORT                    -> 3000 (port the app runs on)
#   NEXT_PUBLIC_API_BASE_URL    -> your backend API base url
#   NEXT_PUBLIC_MAIN_DOMAIN     -> your frontend domain / host
#
# pm2 process name: automart-frontend
# =============================================================================
name: Deploy Automart Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

# The PM2 process name and where the app lives on the server.
env:
  PM2_NAME: automart-frontend
  DEPLOY_DIR: /root/automart-frontend

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    # Prevent two deploys from running at the same time.
    concurrency:
      group: automart-frontend-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NEXT_PUBLIC_* values must exist both at build time and at runtime,
      # so we generate the env file from secrets (it is never committed).
      - name: Write .env.local from secrets
        run: |
          cat > .env.local <<EOF
          NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_MAIN_DOMAIN=${{ secrets.NEXT_PUBLIC_MAIN_DOMAIN }}
          EOF

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_MAIN_DOMAIN: ${{ secrets.NEXT_PUBLIC_MAIN_DOMAIN }}

      # Package everything the server needs (exclude node_modules + .git).
      - name: Package app for deploy
        run: |
          tar -czf automart-deploy.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            .

      - name: Upload bundle to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          source: "automart-deploy.tar.gz"
          target: "/tmp/automart-deploy"

      - name: Release on server (extract, install, pm2 restart)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            set -e

            # ---- 1. Make sure Node.js 20+ (+PM2) exist on the server ----
            if ! command -v node >/dev/null 2>&1 || [ "$(node -v | cut -d. -f1 | sed 's/^v//')" -lt 20 ]; then
              echo ">> Installing/upgrading Node.js 20..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get update -y
              apt-get install -y nodejs
            fi

            if ! command -v pm2 >/dev/null 2>&1; then
              echo ">> Installing PM2..."
              npm install -g pm2
            fi

            # ---- 2. Extract the new bundle (clean target first) ----
            APP_DIR="${{ env.DEPLOY_DIR }}"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            rm -rf "$APP_DIR"/.??* "$APP_DIR"/* 2>/dev/null || true
            tar -xzf /tmp/automart-deploy/automart-deploy.tar.gz -C "$APP_DIR"
            rm -f /tmp/automart-deploy/automart-deploy.tar.gz

            # ---- 3. Install production dependencies ----
            npm ci --omit=dev || npm install --omit=dev

            # ---- 4. (Re)start the app with PM2 on the configured port ----
            export PORT="${{ secrets.APP_PORT }}"
            pm2 delete "${{ env.PM2_NAME }}" >/dev/null 2>&1 || true
            pm2 start npm --name "${{ env.PM2_NAME }}" -- start
            pm2 save --force

            # ---- 5. Quick health check ----
            sleep 5
            if curl -fsS -o /dev/null "http://127.0.0.1:${{ secrets.APP_PORT }}"; then
              echo ">> Deploy OK: app is responding on port ${{ secrets.APP_PORT }}"
            else
              echo ">> Warning: app not responding yet on port ${{ secrets.APP_PORT }}. Check 'pm2 logs ${{ env.PM2_NAME }}'"
            fi
            pm2 status "${{ env.PM2_NAME }}"