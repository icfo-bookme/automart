# Automart Frontend — Auto-deploy on push to main
name: Deploy Automart

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: automart-deploy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build
        run: |
          npm ci
          npm run build

      - name: Package
        run: |
          tar -czf "$RUNNER_TEMP/automart.tar.gz" \
            --exclude node_modules --exclude .git \
            --warning=no-file-changed .
          cp "$RUNNER_TEMP/automart.tar.gz" .

      - name: Upload to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          source: "automart.tar.gz"
          target: /tmp

      - name: Deploy to /var/www/automart
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            cd /var/www/automart
            rm -rf ./*
            tar -xzf /tmp/automart.tar.gz
            rm -f /tmp/automart.tar.gz
            npm ci --omit=dev
            pm2 restart automart-frontend --update-env || pm2 start npm --name automart-frontend -- start
